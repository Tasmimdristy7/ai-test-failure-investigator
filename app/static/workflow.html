<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f1;color:#18251e;font:14px/1.5 system-ui,sans-serif}.player{padding:22px;background:white;border:1px solid #d5dfd8;border-radius:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;color:#177e89}h2{font-size:23px;margin:6px 0}.badge{font-size:12px;background:#edf5ef;padding:7px 12px;border-radius:20px;color:#476454}.canvas{margin-top:18px;overflow:auto;border:1px solid #e2e9e3;border-radius:12px;background-image:radial-gradient(#dde5df .8px,transparent .8px);background-size:18px 18px}svg{display:block;width:100%;min-width:730px;height:auto}.edge{fill:none;stroke:#bac9c0;stroke-width:2;marker-end:url(#arrow)}.edge.done{stroke:#177e89}.edge.active{stroke:#177e89;stroke-width:3;stroke-dasharray:7 5;animation:flow .6s linear infinite}.packet{fill:#177e89}.paused .packet{display:none}.paused .edge{animation-play-state:paused}.node{cursor:pointer;outline:none}.node .card{fill:white;stroke:#c6d3cb;stroke-width:1.5;transition:stroke .3s,fill .3s}.node.done .card{fill:#f1f8f3;stroke:#8cbaa0}.node.active .card,.node:focus-visible .card{stroke:#177e89;stroke-width:3;fill:#edf8f8}.node text{pointer-events:none}.name{font-size:16px;font-weight:650;fill:#18251e}.detail{font-size:12px;fill:#627369}.status{font-size:10px;fill:#6b7e72;font-weight:600;letter-spacing:1px}.icon{font-size:23px;font-weight:700;fill:white}.center-title{font-size:24px;font-weight:700;fill:#263e32}.center-sub{font-size:13px;fill:#64796b}.caption{font-size:11px;fill:#64796b}.explanation{display:grid;grid-template-columns:44px 1fr;gap:12px;margin:18px 0;padding:16px;background:#f1f6f2;border-radius:10px;min-height:100px}.counter{width:36px;height:36px;background:#177e89;color:white;border-radius:9px;display:grid;place-items:center;font-weight:700}.explanation strong{font-size:16px}.explanation p{margin:5px 0 0;color:#52665a}.controls{margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,select{font:inherit;padding:8px 13px;border:1px solid #cbd7cd;border-radius:7px;background:white;color:#18251e;cursor:pointer}button.primary{background:#177e89;color:white;border-color:#177e89}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #d49a24;outline-offset:2px}.note{font-size:12px;color:#687b6e;margin:12px 0 0}@keyframes flow{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.packet{display:none}}@media(max-width:600px){.player{padding:12px}.badge{display:none}h2{font-size:20px}.explanation{min-height:155px}}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.tool{font-size:12px;background:#e8eff6;color:#355a76;padding:4px 9px;border-radius:5px}.mechanism-grid{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:12px}.mechanism-card{padding:14px;border:1px solid #d9e3db;border-radius:9px}.mechanism-card h3{font-size:11px;letter-spacing:1px;color:#177e89;margin:0 0 8px}.mechanism-card p{font-size:13px;margin:0;line-height:1.6}.example{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7f4;border-left:3px solid #d49a24;padding:12px;font:12px/1.6 ui-monospace,monospace;margin:12px 0 8px}.source{font-size:11px;color:#617667;margin-bottom:18px;overflow-wrap:anywhere}@media(max-width:600px){.mechanism-grid{grid-template-columns:1fr}}
</style></head><body><div class="player paused" id="player">
<div class="top"><div><div class="eyebrow">FROM FAILURE TO INVESTIGATION</div><h2>Watch the workflow in motion</h2></div><span class="badge">Illustrated baseline · 50 tests</span></div>
<div class="canvas"><svg id="diagram" viewBox="0 0 1120 610" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Test failure investigation workflow</title><desc id="diagram-desc">Application to tests to outcomes. Passing tests branch off; failures continue through evidence capture, normalization, comparison, clustering, and engineer review. A manual fix and rerun loop returns to the application. Select any box to inspect that step.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7f9e8e"/></marker></defs><g id="edges"></g>
<text x="480" y="270" text-anchor="middle" class="center-title">AI Test Failure</text><text x="480" y="301" text-anchor="middle" class="center-title">Investigator</text><text x="480" y="331" text-anchor="middle" class="center-sub">28 failures → 3 focused investigations</text><text x="480" y="355" text-anchor="middle" class="caption">Expected baseline · click a box to explore</text>
<g id="nodes"></g></svg></div>
<div class="controls"><button id="play" class="primary">Play</button><button id="back">← Back</button><button id="next">Next →</button><button id="replay">Replay</button><label for="speed">Speed</label><select id="speed"><option value="18000">Slow</option><option value="10000" selected>Normal</option><option value="1800">Fast</option></select></div>
<div class="explanation" aria-live="polite"><div id="counter" class="counter"></div><div><strong id="title"></strong><p id="description"></p></div></div>
<div id="mechanics" aria-live="polite"></div>

<p class="note">Animated illustration, not live execution. Use “Run 50-test demo” below for real results. Dashed return path = manual fix and rerun. On small screens, scroll the canvas sideways.</p>
</div><script>
const box=(symbol,label)=>`<div class="box enter"><div class="symbol">${symbol}</div><div class="label">${label}</div></div>`;
const arrow='<span class="arrow enter">→</span>';
const dots=(n,cls='')=>`<div class="tokens">${Array.from({length:n},(_,i)=>`<span class="token ${cls}" style="--i:${i}"></span>`).join('')}</div>`;
const steps=[
['Start with the application','A small e-commerce app has login, search, cart, checkout, orders, and profile. Nine active defects are intentionally built in so the tests have reproducible problems to find.',box('▣','E-commerce app')],
['Run the automated tests','The baseline runs 50 pytest cases against the app. The wider project also includes API, integration, and Playwright browser suites.',box('▣','Application')+arrow+box('▶','50 test cases')],
['Separate passes from failures','In the expected baseline, 22 tests pass and 28 fail. Only the failed tests need investigation; passing tests still count toward the run totals.',`<div><div class="label">22 passed</div>${dots(22,'pass')}</div>${arrow}<div><div class="label">28 failures to investigate</div>${dots(28)}</div>`],
['Capture the evidence','Each failure becomes a structured JSON record: test name, error, stack trace, endpoint, status, and run metadata. Browser failures can also include screenshots and traces.',dots(28)+arrow+box('{}','Failure report')],
['Remove changing noise','Timestamps and changing IDs can make the same error look different. Normalization removes that noise, and fingerprints preserve stable error features.',box('ID · time','Raw errors')+arrow+box('≡','Stable fingerprints')],
['Compare the failures','TF-IDF and cosine similarity measure how alike the normalized errors are. Failures may join when service, endpoint, and status match; exact fingerprints remain grouped.',dots(12,'normal')+arrow+box('≈','Compare similarity')],
['Group related failures','The expected baseline produces three groups: 15 checkout failures, 8 authentication failures, and 5 cart failures. These are likely causes to investigate, not confirmed diagnoses.',`<div class="groups"><div class="group"><strong>15</strong><small>Checkout</small></div><div class="group" style="animation-delay:.2s;border-color:#6457a6"><strong>8</strong><small>Authentication</small></div><div class="group" style="animation-delay:.4s;border-color:#d49a24"><strong>5</strong><small>Cart</small></div></div>`],
['Investigate, fix, and rerun','The dashboard lets an engineer review each group and its evidence. The engineer confirms the cause, fixes the application, and reruns the tests to check the result.',box('▤','Review evidence')+arrow+box('⚒','Engineer fixes')+arrow+box('↻','Rerun tests')]
];

const $=id=>document.getElementById(id);
const explanations=[{"tools": ["FastAPI", "Python", "HTML + JavaScript", "In-memory data"], "input": "A shopping action: sign in, search, add to cart, or check out.", "process": "The storefront calls API endpoints. Python handlers read or update in-memory data and return HTTP responses. Nine active deliberately injected defects give the tests reproducible failures to detect.", "output": "An HTTP status and response body that tests can check.", "example": "Example: POST /api/checkout with an affected coupon \u2192 HTTP 500 instead of a successful order.", "source": "app/main.py \u00b7 app/static/index.html"}, {"tools": ["pytest", "FastAPI TestClient / HTTPX", "Playwright (UI suite)"], "input": "Test scenarios with inputs and expected application behavior.", "process": "The demo runner starts the 50-case baseline. Tests call the app and compare actual responses with assertions. Separate API, integration, Phase 1, and browser suites exercise additional behavior.", "output": "A pytest result for each test, with timing and assertion details.", "example": "Baseline expectation: 50 executions. Playwright belongs to the separate browser suite, not the 50-case demo.", "source": "run_demo.py \u00b7 tests/test_milestone.py \u00b7 tests/api \u00b7 tests/integration \u00b7 tests/ui"}, {"tools": ["pytest assertions", "Expected benchmark checks"], "input": "Actual responses and expected responses for each test.", "process": "An assertion that matches passes. An assertion that does not match fails. The demo runner checks the expected totals and cluster sizes because these defects are intentional.", "output": "Expected baseline: 22 passes and 28 failures. The failures continue into investigation.", "example": "Expected HTTP 401 for an expired token, but received HTTP 200 \u2192 failed authentication test.", "source": "tests/test_milestone.py \u00b7 run_demo.py"}, {"tools": ["pytest hooks", "Python JSON", "Browser evidence hooks"], "input": "A failed test-call report and its endpoint/status metadata.", "process": "The collector reads the error and stack trace, records test identity, duration, commit, and other context, then writes the report at session end. Failed browser tests can attach screenshot and trace paths.", "output": "A JSON report in artifacts/, consumed by the investigator and dashboard.", "example": "Illustrative record: {\"endpoint\":\"/api/checkout\", \"http_status\":500, \"error_message\":\"\u2026\", \"stack_trace\":\"\u2026\"}", "source": "investigator/pytest_plugin.py \u00b7 artifacts/failures.json"}, {"tools": ["Python regular expressions", "Fingerprint dataclass"], "input": "Error text, stack trace, endpoint, and HTTP status.", "process": "Replace timestamps, UUIDs, tokens, ports, line numbers, and selected IDs with stable placeholders. Extract service, endpoint, status, and exception type into a fingerprint.", "output": "Normalized text for comparison, plus a stable four-part fingerprint.", "example": "Illustrative text: order_id=abc123 \u2192 <id>\nFingerprint: checkout | /api/checkout | 500 | AssertionError", "source": "investigator/fingerprints.py"}, {"tools": ["scikit-learn", "TfidfVectorizer", "cosine_similarity"], "input": "Normalized error and stack-trace text, plus endpoint and status.", "process": "Turn single words and two-word phrases into weighted numeric vectors. Cosine similarity measures their overlap. Similarity-based joining requires matching service, endpoint, and status; the default threshold is 0.35. Exact fingerprints join regardless of score.", "output": "Pairwise similarity scores and rules for deciding which failures can join.", "example": "Illustrative pair: same context + score 0.72 \u2265 0.35 \u2192 eligible to join. Different endpoint \u2192 no similarity-based join.", "source": "investigator/clustering.py"}, {"tools": ["Union-find grouping", "Fingerprint labels"], "input": "Exact-fingerprint matches and eligible similarity pairs.", "process": "Join connected failures into groups, including transitive connections. Count affected tests, summarize the group, and calculate mean pair similarity. Sort groups by their failure counts.", "output": "Expected baseline: checkout 15, authentication 8, cart 5.", "example": "28 failed tests \u2192 3 likely-cause groups. Mean similarity describes text overlap; it is not a probability that the diagnosis is correct.", "source": "investigator/clustering.py"}, {"tools": ["Streamlit", "Pandas", "Plotly", "Engineer review"], "input": "The selected JSON report and clusters at the chosen threshold.", "process": "Display totals, a cluster chart, affected tests, normalized errors, similarity examples, and captured evidence paths. An engineer checks the evidence, confirms the cause, changes the application, and reruns the tests.", "output": "A focused investigation and a new test run after manual fixes.", "example": "Inspect the 15-test checkout group \u2192 identify the coupon defect \u2192 fix it \u2192 rerun. The investigator does not generate or apply repairs.", "source": "app/dashboard.py \u00b7 app/main.py \u00b7 tests/"}];
const nodes=[
[40,65,'Application','Storefront + FastAPI','▣','#da9940'],
[310,65,'Run tests','50 baseline cases','▶','#177e89'],
[580,65,'Test outcomes','Split passes and failures','⑂','#d49a24'],
[850,240,'Capture evidence','Errors + traces → JSON','{}','#bf6544'],
[850,440,'Normalize','Stable error fingerprints','≡','#7561b0'],
[580,440,'Compare','TF-IDF + cosine similarity','≈','#7561b0'],
[310,440,'Cluster failures','15 checkout · 8 auth · 5 cart','⋮','#367c54'],
[40,440,'Review + fix','Engineer investigates','✓','#367c54']
];
const paths=[
['M250 110 H300',1],['M520 110 H570',2],
['M685 155 C685 205 925 175 955 230',3],
['M955 330 V430',4],['M850 485 H800',5],['M580 485 H530',6],['M310 485 H260',7],
['M80 440 C8 390 8 210 80 155',8]
];
let index=0,playing=false,timer;
function render(){
 $('player').classList.toggle('paused',!playing);
 $('counter').textContent=index+1;
 $('title').textContent=`${index+1} / 8 · ${steps[index][0]}`;
 $('description').textContent=steps[index][1];
 const explanation=explanations[index];
 const escape=value=>value.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
 $('mechanics').innerHTML=`<div class="tools">${explanation.tools.map(tool=>`<span class="tool">${escape(tool)}</span>`).join('')}</div><div class="mechanism-grid">${[['INPUT',explanation.input],['HOW IT HAPPENS',explanation.process],['OUTPUT',explanation.output]].map(([heading,text])=>`<div class="mechanism-card"><h3>${heading}</h3><p>${escape(text)}</p></div>`).join('')}</div><div class="example">${escape(explanation.example)}</div><div class="source">Implemented in: ${escape(explanation.source)}</div>`;

 $('nodes').innerHTML=nodes.map(([x,y,title,detail,icon,color],i)=>`<g class="node ${i<index?'done':i===index?'active':''}" transform="translate(${x} ${y})" role="button" tabindex="0" aria-label="Step ${i+1}: ${title}" ${i===index?'aria-current="step"':''} data-index="${i}"><rect class="card" width="210" height="90" rx="12"/><rect x="12" y="17" width="38" height="38" rx="9" fill="${color}"/><text x="31" y="44" text-anchor="middle" class="icon">${icon}</text><text x="60" y="35" class="name">${title}</text><text x="12" y="76" class="detail">${detail}</text><text x="60" y="54" class="status">${i<index?'✓ COMPLETE':i===index?'● ACTIVE':'STEP '+(i+1)}</text></g>`).join('')+
 `<g transform="translate(850 65)"><rect width="210" height="90" rx="12" fill="${index>=2?'#edf7ed':'#fff'}" stroke="#adcab5"/><text x="18" y="36" class="name">✓ 22 passed</text><text x="18" y="61" class="detail">Included in run totals</text></g>`;
 $('edges').innerHTML=paths.map(([d,target],i)=>{const active=target===index||(target===8&&index===7);return `<path id="path${i}" d="${d}" class="edge ${target<=index?'done':''} ${active?'active':''}" ${target===8?'style="stroke-dasharray:6 6"':''}/>${active&&playing?`<circle r="5" class="packet"><animateMotion dur="1.6s" repeatCount="indefinite" path="${d}"/></circle>`:''}`}).join('')+
 `<path d="M790 95 H840" class="edge ${index>=2?'done':''}"/><text x="816" y="81" class="caption" text-anchor="middle">pass</text><text x="930" y="192" class="caption" text-anchor="middle">28 failed</text><text x="25" y="306" transform="rotate(-90 25 306)" class="caption" text-anchor="middle">Manual fix + rerun</text>`;
 $('play').textContent=playing?'Pause':index===7?'Play again':'Play';$('back').disabled=index===0;$('next').disabled=index===7;
}
function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{if(index<7){index++;render();schedule()}else{playing=false;render()}},Number($('speed').value))}
function go(i){index=i;render();schedule()}
$('play').onclick=()=>{playing=!playing;if(playing&&index===7)index=0;render();schedule()};
$('back').onclick=()=>go(Math.max(0,index-1));$('next').onclick=()=>go(Math.min(7,index+1));
$('replay').onclick=()=>{playing=true;go(0)};$('speed').onchange=schedule;
function selectNode(e){const node=e.target.closest('[data-index]');if(node){const i=Number(node.dataset.index);go(i);$('nodes').querySelector(`[data-index="${i}"]`).focus({preventScroll:true})}}
$('nodes').onclick=selectNode;$('nodes').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(e)}};
render();
</script></body></html>
