<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">AI Test Failure Investigator — complete workflow</title>
<desc id="desc">Follow the arrows from the e-commerce application through automated tests, failure capture, normalization, similarity comparison, clustering, dashboard review, and a manual engineer investigation and rerun.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#75897e"/></marker></defs>
<rect width="1200" height="820" rx="20" fill="#edf1eb"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="30" y="38" font-size="13" font-weight="700" letter-spacing="2" fill="#52675a">PROJECT WORKFLOW</text><text x="30" y="66" font-size="19" fill="#18251e">From reproducible defects to evidence an engineer can act on</text>
<g fill="none" stroke="#75897e" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M370 173 H418"/><path d="M770 173 H818"/><path d="M1000 256 V298"/>
<path d="M830 393 H782"/><path d="M430 393 H382"/><path d="M200 476 V518"/>
